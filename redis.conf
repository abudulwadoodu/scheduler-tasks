#####################################
# Redis Persistence Configuration
#####################################

# RDB snapshotting
# (comments must be ABOVE the save line, not inline)

# snapshot every 15 minutes if at least 1 key changed
save 900 1

# snapshot every 5 minutes if at least 10 keys changed
save 300 10

# snapshot every 60 seconds if at least 10k keys changed
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb


#####################################
# AOF — Append Only File
#####################################

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb


#####################################
# General settings
#####################################

protected-mode no
dir /data
loglevel notice
tcp-keepalive 300
