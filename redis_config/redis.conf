# ================================
# Redis Persistence Configuration
# ================================

# RDB snapshotting — good balance
save 900 1       # snapshot every 15 min if 1 key changes
save 300 10      # snapshot every 5 min if 10 keys change
save 60 10000    # snapshot every 60 sec if 10k keys change

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ================================
# Append Only File (AOF)
# Best durability — almost zero data loss
# ================================

appendonly yes
appendfilename "appendonly.aof"

# sync policy: safest = always, best performance = everysec
appendfsync everysec

# auto rewrite AOF file to prevent giant file size
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ================================
# General Setup
# ================================

protected-mode no
dir /data

# Enable TCP keepalive
tcp-keepalive 300

# Optional: Log level
loglevel notice
